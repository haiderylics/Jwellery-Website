[project]
name = "jewellery-website"
version = "0.1.0"
description = "Premium jewellery catalog, cart, and WhatsApp-assisted ordering website"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.71",
    "django>=6.0,<6.1",
    "django-cors-headers>=4.6.0",
    "django-storages[s3]>=1.14.6",
    "djangorestframework>=3.15.2",
    "gunicorn>=26.0.0",
    "pillow>=11.0.0",
    "psycopg[binary]>=3.2.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "pip-audit>=2.8.0",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "frontend",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "DJ",   # flake8-django
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101", "S105", "S106"]  # Allow asserts and test tokens in tests
"backend/config/settings/development.py" = ["S105"]  # Allow dev-only fallback secret key

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.config.settings.development"
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["backend/tests"]
addopts = "--strict-markers -v"

[tool.bandit]
exclude_dirs = [
    ".venv",
    "backend/tests",
    "frontend",
]
skips = ["B101"]  # skip assert warnings if outside tests
